packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm blocks all others by default).
allowBuilds:
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/darwin-arm64": true
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@clerk/backend@3.26.2'
  - '@clerk/nextjs@7.9.20'
  - '@clerk/react@6.18.1'
  - '@clerk/shared@4.41.1'
  - '@next/env@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - next@16.4.3
